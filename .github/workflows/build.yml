

name: Build GreenTool PS4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
      - name: Installer et tester OpenOrbis
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: echo "OpenOrbis disponible"
      - name: Verifier les fichiers
        run: |
          echo "GreenTool PS4"
          find . -maxdepth 3 -type f
