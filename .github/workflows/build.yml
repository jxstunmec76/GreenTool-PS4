
name: Verifier le projet

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Verifier les fichiers
        run: |
          echo "GreenTool PS4"
          echo "Verification des fichiers..."
          find . -maxdepth 3 -type f

